# Isolated optional sandbox. No published ports or external network on the n8n services.
x-n8n: &sandbox
  image: n8nio/n8n:2.49.5
  networks: [workflow]
  environment:
    N8N_DIAGNOSTICS_ENABLED: "false"
    N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
    N8N_TEMPLATES_ENABLED: "false"
    N8N_PERSONALIZATION_ENABLED: "false"
    N8N_COMMUNITY_PACKAGES_ENABLED: "false"
    N8N_PUBLIC_API_DISABLED: "true"
    N8N_DISABLE_UI: "true"
    N8N_SSRF_ALLOWED_HOSTNAMES: gateway
    EXECUTIONS_DATA_SAVE_ON_SUCCESS: none
    EXECUTIONS_DATA_SAVE_ON_ERROR: none
  volumes:
    - workflowdata:/home/node/.n8n
    - ./workflows:/workflows:ro
services:
  n8n-import:
    <<: *sandbox
    command: ["import:workflow","--input=/workflows/sandbox-review.json"]
  n8n-publish:
    <<: *sandbox
    depends_on:
      n8n-import: {condition: service_completed_successfully}
    command: ["publish:workflow","--id=NexusReviewLocal1"]
  n8n:
    <<: *sandbox
    depends_on:
      n8n-publish: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD","node","-e","fetch('http://127.0.0.1:5678/healthz/readiness').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 45
  gateway:
    environment: {NOTIFICATION_MODE: n8n}
    networks: [default, workflow]
    depends_on:
      n8n: {condition: service_healthy}
networks:
  workflow: {internal: true}
volumes:
  workflowdata:
